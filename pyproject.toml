[project]
name = "trustloop"
version = "2.0.0"
description = "AI-assisted security questionnaire automation for B2B SaaS vendors"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "langgraph>=0.2.0",
    "pydantic>=2.5.0",
    "openpyxl>=3.1.2",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
exclude = [".venv", "__pycache__", ".pytest_cache", ".ruff_cache", "data", "exports"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "B", "SIM", "RUF", "S", "DTZ", "FLY", "ISC", "PLR", "FURB"]
ignore = [
    "S101",  # assert used in tests
    "PLR2004",  # magic numbers for thresholds are documented
    "EM101", "EM102",  # f-string in exception is fine here
    "TRY003",  # long messages in ValueError are intentional for API errors
    "E501",  # long inline CSS/HTML lines in app.py are intentional
    "S311",  # random is for demo starfield animation, not crypto
    "PLR0913", "PLR0917",  # review-decision helpers take explicit kwargs by design
]

[tool.ruff.lint.per-file-ignores]
"storage/db.py" = ["BLE001", "S110"]  # persistence must never crash the pipeline; all failures are logged
"app.py" = ["BLE001", "S110"]  # Streamlit query-param cleanup is best-effort
"tests/*" = ["S101", "RUF059", "FLY002"]  # test readability over micro-optimizations

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
